[package]
name = "bark-server-rs"
version = "0.1.0"
edition = "2024"

# Binary keeps the upstream name for deployment-shape parity.
[[bin]]
name = "bark-server"
path = "src/main.rs"

[lib]
name = "bark_server_rs"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
axum-server = { version = "0.9.1", default-features = false, features = ["tls-rustls"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
http = "1.5.0"
hyper = "1.12.0"
pin-project-lite = "0.2.17"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-util", "process"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
libc = "0.2.191"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tempfile = "3.27.0"
