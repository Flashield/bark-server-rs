[package]
name = "bark-server-rs"
version = "0.1.0"
edition = "2024"

# Binary keeps the upstream name for deployment-shape parity.
[[bin]]
name = "bark-server"
path = "src/main.rs"

[lib]
name = "bark_server_rs"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
axum-server = { version = "0.9.1", default-features = false, features = ["tls-rustls"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
http = "1.5.0"
hyper = "1.12.0"
pin-project-lite = "0.2.17"
quick-xml = { version = "0.42.0", default-features = false, features = ["serialize"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order keeps JSON object keys in document order, mirroring Go's
# encoding/json where a later duplicate key overwrites an earlier one.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "io-util", "process", "sync"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls"] }
# PostgreSQL backend (ticket 12, ADR-0005): the sync client from the
# rust-postgres family — the Store trait is deliberately sync (see
# store::Store docs), and the client cannot even be constructed on an
# async runtime thread, so the impl dispatches through one dedicated
# worker thread (the SQLite impl's serialization semantics).
postgres = "0.19.14"
# Stream combinators for the SSE endpoint's event stream (unfold over the
# event bus's broadcast receiver); already in the graph via axum.
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }

[dev-dependencies]
libc = "0.2.191"
p256 = { version = "0.14.0", features = ["pem"] }
rcgen = "0.14.10"
# multipart: V1 collection tests drive the multipart form source over HTTP.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart"] }
tempfile = "3.27.0"
